# 静态站的服务端配置。两件事非有不可：
#
# 1. **try_files 里的 $uri.html。** VitePress 开着 cleanUrls，产物是
#    zh_CN/regulation.html，而站内链接写的是 /zh_CN/regulation。没有这一条，
#    除了首页以外每一页都是 404，而本地 `vitepress dev` 和 `preview` 都自己
#    做了这层映射，所以这个错只会在集群里出现。
# 2. **404 走 VitePress 自己那张 404.html**，否则拿到的是 nginx 的默认页。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的产物可以长缓存；HTML 不行 —— 换一版之后还得让人拿到新的。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
