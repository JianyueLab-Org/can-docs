# 静态站的服务端配置。三件事非有不可：
#
# 1. **try_files 里的 $uri.html。** VitePress 开着 cleanUrls，产物是
#    zh_CN/regulation.html，而站内链接写的是 /zh_CN/regulation。没有这一条，
#    除了首页以外每一页都是 404 —— 而本地 `vitepress dev` 和 `preview` 都自己
#    做了这层映射，所以这个错只会在集群里出现。
# 2. **try_files 的最后一个参数写 =404，不是 /404.html。** 最后一个参数是「回退
#    URI」，会以 **200** 内部跳转过去；那样每一个打错的地址都返回 200，搜索引擎
#    会把它们当成真页面收录。=404 才是真的 404，页面由下面的 error_page 给。
# 3. **缓存用 expires 而不是 add_header Cache-Control。** nginx 的 add_header 只
#    在当前层**一条 add_header 都没有**时才从上层继承 —— 在某个 location 里加一
#    条 Cache-Control，就会把 server 层那几条安全头全部丢掉。expires 走的是另一
#    套机制，不影响继承。代价是拿不到 immutable 这个提示，值得。
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 跳转只写路径，不写 scheme、主机和端口。nginx 在集群里听的是 8080、前面是
    # 终结 TLS 的 ingress，默认的绝对跳转会写成 http://docs.ceruleanavi.net:8080/…，
    # 浏览器照着走就是一个打不开的地址。相对的 Location 由浏览器按当前地址补全。
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 文件名里带内容 hash，改了内容就换了名字，可以放心长缓存。
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # zh_TW 已撤掉（只剩 zh_CN 和 en_US）。/zh_TW/regulation 上线过，留一条 301。
    # 不带斜杠的 /zh_TW 也接住，落在 /zh_CN/；查询串原样带过去。正则 location 排
    # 在前缀 location / 之前生效（/ 没有 ^~），/zh_TWx 这类不会误中。
    location ~ ^/zh_TW(?:/(?<zh_tw_rest>.*))?$ {
        return 301 /zh_CN/$zh_tw_rest$is_args$args;
    }

    # HTML 每次都回源校验：改完一条规章，读者下一次刷新就该看到新的。
    location / {
        expires -1;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
